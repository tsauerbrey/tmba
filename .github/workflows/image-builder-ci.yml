name: Image Builder CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Builder validieren
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: pytest installieren
        run: python -m pip install pytest
      - name: Builder validieren
        run: ./image-builder/validate.sh
      - name: Builder testen
        run: python -m pytest -q image-builder/tests
      - name: Buildplan erzeugen
        run: ./image-builder/build.sh --dry-run
