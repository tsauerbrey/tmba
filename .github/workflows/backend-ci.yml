name: Backend CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Backend testen
        env:
          PYTHONPATH: .
        run: python -m pytest -q

  package:
    name: Quellpaket erzeugen
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Paketverzeichnis vorbereiten
        run: |
          mkdir -p dist/tmba
          rsync -a ./ dist/tmba/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.venv/' \
            --exclude '__pycache__/' \
            --exclude '.pytest_cache/' \
            --exclude '*.pyc' \
            --exclude '.DS_Store'

      - name: ZIP erzeugen
        working-directory: dist
        run: zip -r "TMBA-${GITHUB_SHA::7}.zip" tmba

      - name: Build-Artefakt bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: tmba-${{ github.sha }}
          path: dist/TMBA-*.zip
          if-no-files-found: error
          retention-days: 14
