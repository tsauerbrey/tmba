name: Fehlerbericht
description: Einen reproduzierbaren Fehler in TMBA-OS melden
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Danke für den Fehlerbericht. Bitte beschreibe das Problem möglichst genau.

  - type: textarea
    id: description
    attributes:
      label: Fehlerbeschreibung
      description: Was funktioniert nicht?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Schritte zur Reproduktion
      description: Welche Schritte führen zum Fehler?
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Erwartetes Verhalten
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Tatsächliches Verhalten
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Plattform
      options:
        - Raspberry Pi
        - macOS
        - Linux
        - Andere
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: TMBA-Version
      placeholder: v0.6.0

  - type: textarea
    id: logs
    attributes:
      label: Protokollausgabe
      render: shell
